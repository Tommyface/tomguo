name: Catalog snapshot

on:
  schedule:
    # 每 6 小时生成一次，赶在用户高峰前更新首帧快照
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-snapshot
  cancel-in-progress: false

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Build probe
        run: go build -o "$RUNNER_TEMP/probe" ./cmd/probe
        working-directory: native

      - name: Prepare module data dir
        run: |
          mkdir -p "$RUNNER_TEMP/moddata/modules"
          cp -r /dev/null /dev/null 2>/dev/null || true

      # 站源模块 zip 发布在 tomguo-app 仓库 tomguo/modules/；
      # 快照只做目录索引，不搬运源站内容。
      - name: Install modules for snapshot
        env:
          BASE: https://fastly.jsdelivr.net/gh/Tommyface/tomguo-app@main/tomguo/modules
          MODULES: chaoliu-1.0.0.zip heitao-guoapp-1.0.0.zip madou-1.0.0.zip huanggua-1.0.0.zip hkdoll-1.0.0.zip huangguo-official-1.3.0.zip jinguoduanju-1.0.0.zip
        run: |
          mkdir -p "$RUNNER_TEMP/moddata/modules"
          for zip in $MODULES; do
            id="${zip%-*}"
            curl -fsSL --retry 3 "$BASE/$zip" -o "$RUNNER_TEMP/$zip"
            mkdir -p "$RUNNER_TEMP/moddata/modules/$id"
            python3 -c "import zipfile,sys;zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
              "$RUNNER_TEMP/$zip" "$RUNNER_TEMP/moddata/modules/$id"
            echo "installed $id"
          done

      - name: Generate catalog snapshot
        env:
          SOURCES: chaoliu,heitao-guoapp,madou,huanggua,hkdoll,huangguo-official,jinguoduanju
        run: |
          python3 scripts/build_catalog_snapshot.py \
            --probe "$RUNNER_TEMP/probe" \
            --data-dir "$RUNNER_TEMP/moddata" \
            --sources "$SOURCES" \
            --out "$RUNNER_TEMP/catalog" \
            --pages 5

      # 产物上传为 Actions artifact，发布到 tomguo-app 由维护者手动执行
      # scripts/publish_catalog_snapshot.py（需要 GH_TOKEN）。
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-snapshot
          path: ${{ runner.temp }}/catalog/
          retention-days: 7
